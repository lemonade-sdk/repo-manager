<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repo Manager</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --panel-2: #f1f4f7;
      --text: #17202a;
      --muted: #647385;
      --line: #d7dde5;
      --accent: #176b87;
      --accent-2: #0f766e;
      --danger: #b42318;
      --warn: #9a5b00;
      --ok: #14743f;
      --chrome: #15202b;
      --chrome-text: #b9c7d3;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html {
      height: 100%;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      height: 100%;
      overflow: hidden;
    }
    button, input, select {
      font: inherit;
    }

    /* --- the chrome -------------------------------------------------------------------
       One bar across the top: what this is, which of the three lists you are looking at,
       and who you are. Everything else on the page belongs to a tab, and lives inside it. */
    .shell {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }
    .topnav {
      background: var(--chrome);
      color: #eef4f8;
      border-bottom: 1px solid #0c141c;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 20px;
      padding: 0 18px;
      min-height: 54px;
    }
    .brand {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .tabs {
      display: flex;
      gap: 4px;
      justify-self: center;
    }
    .tab {
      border: 0;
      background: transparent;
      color: var(--chrome-text);
      padding: 7px 14px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 550;
    }
    .tab:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.07);
    }
    .tab.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
    }
    .identity {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .repo {
      color: #93a4b3;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* The GitHub login is the one piece of identity the whole page runs on, so it is typed
       once, here, and remembered by this browser. */
    .who {
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.06);
      border-radius: 7px;
      padding: 0 9px;
    }
    .who:focus-within {
      border-color: #4b7f99;
      background: rgba(255, 255, 255, 0.11);
    }
    .who .at {
      color: #7f93a5;
      font-size: 13px;
    }
    .who input {
      width: 132px;
      border: 0;
      outline: none;
      background: transparent;
      color: #ffffff;
      font-size: 13px;
      padding: 6px 2px;
    }
    .who input::placeholder {
      color: #6f8496;
    }

    .content {
      min-width: 0;
      min-height: 0;
      padding: 16px 18px 22px;
      overflow: hidden;
    }
    .split {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(420px, 0.92fr) minmax(360px, 1.08fr);
      gap: 16px;
      align-items: stretch;
    }
    /* A release is picked from a short list and then read at length, so the reading pane
       gets the room. */
    #view-releases.split {
      grid-template-columns: minmax(360px, 0.75fr) minmax(420px, 1.25fr);
    }
    /* The PR list is the scanning surface and needs room for a description; the review
       beside it is read one at a time and has been sitting on slack. The old split left
       the list 535px against 558px of fixed columns, which squeezed Description to 35px
       and then, once the head stopped overflowing and forcing the pane wider, to nothing. */
    #view-prs.split {
      grid-template-columns: minmax(560px, 1.2fr) minmax(340px, 0.8fr);
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }
    .panel-head {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      /* A list head carries a title, its filters, a count and sometimes the sync controls,
         which is more than fits across a split pane. Without wrapping the row simply
         overflows and the panel clips whatever is furthest right — which silently ate the
         freshness label and the Refresh button. */
      flex-wrap: wrap;
      gap: 8px 12px;
      min-height: 45px;
    }
    .panel-head h2 {
      font-size: 15px;
      margin: 0;
      white-space: nowrap;
    }
    /* Filters belong to the list they filter, so they sit in its head rather than in the
       chrome above, where they would claim to apply to the whole page. */
    .head-select,
    .head-search {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 8px;
      background: #fff;
      color: var(--text);
      font-size: 12px;
    }
    .head-search {
      flex: 1 1 150px;
      min-width: 110px;
      max-width: 340px;
    }
    .pr-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
    }
    .pr-toggle input {
      accent-color: var(--accent);
      margin: 0;
    }
    /* Held together on one line and pushed to the right end of whichever row they land
       on, so the freshness reads as a property of the column rather than another filter. */
    .sync-group {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .sync-state {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }
    /* A sync that failed is the one thing here allowed to raise its voice: the column is
       still showing its last known answer, and the reader has to know it is not live. */
    .sync-state.stale {
      color: #9a6b00;
    }
    .sync-state.failed {
      color: #b4232a;
      font-weight: 600;
    }
    .sync-button {
      font-size: 12px;
      padding: 4px 9px;
    }

    /* --- sub-tabs ---------------------------------------------------------------------
       A release ships four things — a tester's checklist, notes, a Discord post, and a
       record of what went into it. They are one release read four ways, so they share a pane
       and take turns in it rather than each claiming a tab of their own. */
    .subtabs {
      display: flex;
      gap: 2px;
      flex-wrap: wrap;
    }
    .subtab {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 6px 11px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 550;
      white-space: nowrap;
    }
    .subtab:hover {
      background: var(--panel-2);
      color: var(--text);
    }
    .subtab.active {
      background: var(--panel-2);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--line);
    }

    .table-wrap {
      overflow: auto;
      min-height: 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    /* Fixed column widths and a fixed layout mean a pane narrower than their sum does not
       shrink the columns — it silently starves whichever column has no width of its own.
       A floor plus the scroll box the wrap already provides is what keeps Description
       readable instead of letting it vanish. */
    #view-prs table {
      min-width: 690px;
    }
    #view-releases table {
      min-width: 380px;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    th {
      position: sticky;
      top: 0;
      background: var(--panel-2);
      color: #435366;
      font-size: 12px;
      text-transform: uppercase;
      z-index: 1;
    }
    tr {
      cursor: pointer;
    }
    tbody tr:hover {
      background: #f6fafb;
    }
    tbody tr.selected {
      background: #e8f3f6;
    }
    .commit-cell {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: #1d5268;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .release-cell {
      font-weight: 650;
      white-space: nowrap;
    }
    .description {
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .pr-check {
      cursor: pointer;
      vertical-align: middle;
      accent-color: #1f77b4;
    }
    /* A checked-off PR stays in the list but has stopped asking for anything. */
    #pr-rows tr.checked-off td:not(:first-child) {
      opacity: 0.5;
    }
    /* Wherever a handle is yours, the page says so rather than making you match it. */
    .you {
      margin-left: 5px;
      font-size: 11px;
      font-weight: 650;
      color: var(--accent);
      background: #e6f1f5;
      border: 1px solid #c3dde6;
      border-radius: 4px;
      padding: 0 4px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      height: 22px;
      border-radius: 999px;
      padding: 0 8px;
      font-size: 12px;
      font-weight: 650;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .badge.clean, .badge.ready {
      color: var(--ok);
      background: #e9f7ef;
      border-color: #bfe7d0;
    }
    .badge.resolved {
      color: var(--accent-2);
      background: #e6f6f4;
      border-color: #b9e4df;
    }
    .badge.needs-attention {
      color: var(--warn);
      background: #fff5df;
      border-color: #f4d79a;
    }
    .badge.blocker, .badge.blocked, .badge.high {
      color: var(--danger);
      background: #fff0ee;
      border-color: #f4c4bd;
    }
    .badge.hotfix {
      color: var(--accent-2);
      background: #e6f6f4;
      border-color: #b9e4df;
      height: 19px;
      font-size: 11px;
    }
    .pr-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge.routine {
      color: var(--ok);
      background: #e9f7ef;
      border-color: #bfe7d0;
    }
    .badge.elevated {
      color: var(--warn);
      background: #fff5df;
      border-color: #f4d79a;
    }
    /* Status colors answer "do I need to act?":
       green = no, gray = someone else is handling it, yellow = yes, red = urgent. */
    .badge.merge, .badge.approved, .badge.requests {
      color: var(--ok);
      background: #e9f7ef;
      border-color: #bfe7d0;
    }
    .badge.in-progress, .badge.handled, .badge.waiting, .badge.in-discussion, .badge.waiting-for-rfc {
      color: #5c6470;
      background: #f0f1f3;
      border-color: #d8dbe0;
    }
    .badge.review, .badge.needs-reviewer, .badge.needs-triage, .badge.waiting-for-me {
      color: var(--warn);
      background: #fff5df;
      border-color: #f4d79a;
    }
    .badge.needs-core {
      color: var(--danger);
      background: #fff0ee;
      border-color: #f4c4bd;
    }
    /* A PR the author still owes work on, and the check that says why. */
    .badge.not-ready, .badge.bundled {
      color: var(--warn);
      background: #fff5df;
      border-color: #f4d79a;
    }
    .badge.focused, .badge.adequate, .badge.accurate, .badge.none-found {
      color: var(--ok);
      background: #e9f7ef;
      border-color: #bfe7d0;
    }
    .badge.gaps, .badge.discrepancies {
      color: var(--warn);
      background: #fff5df;
      border-color: #f4d79a;
    }
    .badge.missing {
      color: var(--danger);
      background: #fff0ee;
      border-color: #f4c4bd;
    }
    .badge.not-applicable, .badge.unknown, .badge.tone-neutral {
      color: #5c6470;
      background: #f0f1f3;
      border-color: #d8dbe0;
    }
    .badge.tone-ok {
      color: var(--ok);
      background: #e9f7ef;
      border-color: #bfe7d0;
    }
    .badge.tone-warn {
      color: var(--warn);
      background: #fff5df;
      border-color: #f4d79a;
    }
    .badge.tone-road {
      background: #dbe7f5;
      color: #24507f;
    }
    .badge.tone-danger {
      color: var(--danger);
      background: #fff0ee;
      border-color: #f4c4bd;
    }
    .detail {
      padding: 16px;
      display: grid;
      gap: 14px;
      align-content: start;
      min-height: 0;
      overflow: auto;
    }
    .kv {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .kv strong {
      color: var(--text);
      font-weight: 600;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .section h3 {
      font-size: 13px;
      text-transform: uppercase;
      color: #435366;
      margin: 0 0 8px;
      letter-spacing: 0;
    }
    .section p {
      margin: 0;
      line-height: 1.5;
    }
    .pr-split {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 20px 0 18px;
    }
    .md > * + * {
      margin-top: 10px;
    }
    .md > h4:first-child {
      margin-top: 0;
    }
    .md h4 {
      font-size: 13px;
      text-transform: uppercase;
      color: #435366;
      margin: 18px 0 0;
      letter-spacing: 0;
    }
    .md ul {
      margin: 0;
      padding-left: 20px;
    }
    .md ul ul {
      margin-top: 4px;
      color: #5a6b7f;
    }
    .md li {
      line-height: 1.5;
    }
    /* A checkbox is the marker. The list sits at the text margin, as a to-do list does. */
    .md li.task {
      list-style: none;
      margin-left: -20px;
    }
    /* The comment reads at three weights, and they follow the markup's own nesting rather
       than a list of known headings: the lead verdict, the sections under it, and the blocks
       inside a fold. A fold is subordinate to the section it explains, so it carries no rule
       of its own — a border-top there read as a divider between top-level parts and made
       "Explanation" outrank the "Review suggestion" it belongs to. */
    th.sortable {
      cursor: pointer;
      user-select: none;
    }
    th.sortable:hover {
      color: #1f2a37;
    }
    th.sorted {
      color: #1f2a37;
      font-weight: 700;
    }
    .md-verdict {
      margin-bottom: 14px;
    }
    .md-section {
      font-size: 15px;
      font-weight: 700;
      color: #1f2a37;
      margin-top: 22px;
    }
    .md-subhead {
      font-size: 13px;
      font-weight: 650;
      color: #435366;
    }
    .md details {
      margin-top: 12px;
    }
    .md summary {
      cursor: pointer;
      display: flex;
      align-items: baseline;
      gap: 6px;
      list-style: none;
      width: fit-content;
    }
    .md summary::-webkit-details-marker {
      display: none;
    }
    /* The caret leads the label. It used to be pushed to margin-left:auto, which on a pane
       this wide left it a screen away from the word it discloses. */
    .md summary::before {
      content: "\25b8";
      color: #98a2ae;
      font-size: 10px;
    }
    .md details[open] > summary::before {
      content: "\25be";
    }
    .md details[open] > summary {
      margin-bottom: 8px;
    }
    /* Open, the fold's contents are railed off so they read as inside something. */
    .md details[open] {
      border-left: 2px solid var(--line);
      padding-left: 12px;
      margin-left: 2px;
    }
    .md-fold-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #8794a4;
      font-weight: 600;
    }
    .md summary:hover .md-fold-label {
      color: #5a6b7f;
    }
    .md-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: #5a6b7f;
      font-weight: 650;
    }
    .md-footer {
      border-top: 1px solid var(--line);
      padding-top: 10px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .md code {
      background: rgba(31, 119, 180, 0.08);
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 12px;
    }
    ul {
      margin: 0;
      padding-left: 18px;
    }
    li {
      margin: 4px 0;
      line-height: 1.45;
    }
    .evidence-list {
      display: grid;
      gap: 10px;
    }
    .evidence-item {
      border-left: 3px solid var(--line);
      padding-left: 10px;
    }
    .evidence-item h4 {
      margin: 0 0 4px;
      color: #435366;
      font-size: 12px;
      font-weight: 700;
      text-transform: capitalize;
    }
    .evidence-item p {
      margin: 0;
      line-height: 1.5;
    }
    .muted {
      color: var(--muted);
      font-size: 12px;
    }
    .todo-count {
      color: #27384a;
      font-weight: 650;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .todo-count.done {
      color: var(--muted);
      font-weight: 500;
    }
    .todo-count .of {
      color: var(--muted);
      font-weight: 500;
    }
    .todo-list {
      display: grid;
      gap: 7px;
    }
    /* A to-do is a thing to do, so it gets a box. The box is this browser's note to itself
       about what I have worked through; the artifact the item came from is still the record
       of what the release owes. */
    .todo-item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 9px;
      align-items: start;
      line-height: 1.45;
      cursor: pointer;
    }
    .todo-item input {
      margin: 3px 0 0;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .todo-item code {
      background: rgba(31, 119, 180, 0.08);
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    .todo-item.done code {
      background: transparent;
    }
    .todo-item.done > span {
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-thickness: 1px;
    }
    /* The priority is the subsection the item sits in, not a word repeated down the
       margin twenty times. */
    .todo-group {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      font-weight: 700;
      color: #435366;
      margin: 16px 0 7px;
      display: flex;
      align-items: baseline;
      gap: 7px;
    }
    .todo-group:first-child {
      margin-top: 0;
    }
    .todo-group.p0 {
      color: var(--danger);
    }
    .todo-group .count {
      font-weight: 500;
      color: var(--muted);
      text-transform: none;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
    }
    .todo-source {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .todo-source a {
      color: var(--accent);
    }
    .plain-item {
      line-height: 1.45;
    }
    .plain-list {
      display: grid;
      gap: 8px;
    }
    .platforms {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    /* --- stats ------------------------------------------------------------------------
       What the release is made of. Every figure is one row of one table: a number is worth
       reading against the number above it, and cards put each one in a box of its own. */
    .stats-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: auto;
    }
    .stats-table td {
      padding: 7px 0;
      border-bottom: 1px solid var(--line);
      vertical-align: baseline;
    }
    .stats-table tr:last-child td {
      border-bottom: 0;
    }
    .stats-table .value {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      white-space: nowrap;
      width: 1%;
      padding-left: 16px;
    }
    .stats-table .of {
      color: var(--muted);
      font-weight: 400;
    }
    /* A group label is a row, not a heading above the table, so the columns stay in one
       grid the whole way down. */
    .stats-table .group td {
      padding: 18px 0 5px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: #435366;
      font-weight: 700;
    }
    .stats-table tr:first-child.group td {
      padding-top: 0;
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
      background: #0f1720;
      color: #e7eef5;
      border-radius: 8px;
      padding: 14px;
      max-height: 100%;
      overflow: auto;
    }
    .empty {
      padding: 18px;
      color: var(--muted);
    }
    .copy {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 6px;
      padding: 7px 10px;
      cursor: pointer;
    }
    .copy:disabled {
      color: #98a2ae;
      background: #f6f7f9;
      cursor: not-allowed;
    }
    .hidden {
      display: none;
    }
    @media (max-width: 980px) {
      body {
        overflow: auto;
      }
      .shell {
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }
      .content {
        overflow: visible;
      }
      .split {
        grid-template-columns: 1fr;
        height: auto;
      }
      #view-releases.split,
      #view-prs.split {
        grid-template-columns: 1fr;
      }
      .topnav {
        grid-template-columns: auto 1fr;
        gap: 10px 16px;
        padding: 10px 18px;
      }
      .tabs,
      .identity {
        justify-self: start;
      }
      .identity {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topnav">
      <div class="brand">Repo Manager</div>
      <nav class="tabs">
        <button class="tab active" data-view="releases">Releases</button>
        <button class="tab" data-view="commits">Commits</button>
        <button class="tab" data-view="prs">PRs</button>
      </nav>
      <div class="identity">
        <span class="repo" id="repo-name"></span>
        <label class="who" title="Your GitHub login. The whole page is written from this account's point of view: PR status, what is yours, and everything you have checked off. This browser remembers it.">
          <span class="at">@</span>
          <input id="viewer" spellcheck="false" autocomplete="off" placeholder="github-id"
                 aria-label="Your GitHub login">
        </label>
      </div>
    </header>
    <section class="content">
      <div id="view-releases" class="split">
        <section class="panel">
          <div class="panel-head">
            <h2>Releases</h2>
            <span class="muted" id="release-count"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style="width: 150px;">Release</th>
                  <th style="width: 104px;">Checklist</th>
                  <th style="width: 92px;">Commits</th>
                </tr>
              </thead>
              <tbody id="release-rows"></tbody>
            </table>
          </div>
        </section>
        <section class="panel">
          <div class="panel-head">
            <div class="subtabs" id="release-subtabs">
              <button class="subtab active" data-sub="review">Review</button>
              <button class="subtab" data-sub="notes">Release notes</button>
              <button class="subtab" data-sub="announcement">Announcement</button>
              <button class="subtab" data-sub="stats">Stats</button>
            </div>
            <span class="sync-group">
              <button class="copy sync-button hidden" id="release-copy"></button>
            </span>
          </div>
          <div class="detail" id="release-detail"></div>
        </section>
      </div>

      <div id="view-commits" class="split hidden">
        <section class="panel">
          <div class="panel-head">
            <h2>Commits</h2>
            <select class="head-select" id="commit-bucket" aria-label="Filter by release"></select>
            <input class="head-search" id="commit-search" placeholder="Filter commits, verdicts, authors">
            <span class="muted" id="commit-count"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style="width: 48px;">#</th>
                  <th style="width: 118px;">Commit</th>
                  <th style="width: 144px;">Verdict</th>
                  <th style="width: 86px;">To-Dos</th>
                  <th>Description</th>
                  <th style="width: 140px;">Author</th>
                </tr>
              </thead>
              <tbody id="commit-rows"></tbody>
            </table>
          </div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2>Commit Review</h2><span class="muted" id="commit-selected"></span></div>
          <div class="detail" id="commit-detail"></div>
        </section>
      </div>

      <div id="view-prs" class="split hidden">
        <section class="panel">
          <div class="panel-head">
            <h2>Pull Requests</h2>
            <input class="head-search" id="pr-search" placeholder="Filter PRs, titles, authors">
            <label class="muted pr-toggle"><input type="checkbox" id="pr-hide-closed" checked> Hide closed</label>
            <label class="muted pr-toggle"><input type="checkbox" id="pr-hide-non-main" checked> Hide non-main</label>
            <label class="muted pr-toggle"><input type="checkbox" id="pr-hide-drafts" checked> Hide drafts</label>
            <span class="muted" id="pr-count"></span>
            <span class="sync-group">
              <span class="sync-state" id="pr-sync"></span>
              <button class="copy sync-button" id="pr-refresh" title="Fetch the current state of every reviewed PR from GitHub now">Refresh</button>
            </span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style="width: 34px;" title="Checked off: stays checked until the PR's Status changes"></th>
                  <th style="width: 72px;" class="sortable" data-sort="pr" title="Sort by PR number">PR</th>
                  <th style="width: 128px;" class="sortable" data-sort="status" title="Sort by how much this needs from you">Status</th>
                  <th style="width: 104px;" class="sortable" data-sort="attention" title="Elevated when the label, body, or docs and tests need attention">Attention</th>
                  <th class="sortable" data-sort="description">Title</th>
                  <th style="width: 140px;" class="sortable" data-sort="author">Author</th>
                </tr>
              </thead>
              <tbody id="pr-rows"></tbody>
            </table>
          </div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2>PR Review</h2><span class="muted" id="pr-selected"></span></div>
          <div class="detail" id="pr-detail"></div>
        </section>
      </div>
    </section>
  </div>

  <script>
    const isStatic = Boolean(window.REPO_MANAGER_STATIC);

    // What this browser remembers about how I left the dashboard: who I am, which PRs and
    // which to-dos I have checked off, and how I had the list sorted. None of it is a fact
    // about the repo, so none of it is worth a round trip to the server or a file in the
    // state directory — it is one person's notes to themselves about work in progress.
    const VIEWER_KEY = "repo-manager:viewer";
    const PR_CHECKS_KEY = "repo-manager:pr-checks";
    const TODO_CHECKS_KEY = "repo-manager:todo-checks";
    const PR_SORT_KEY = "repo-manager:pr-sort";

    function readStored(key, fallback) {
      try {
        const stored = JSON.parse(window.localStorage.getItem(key));
        return stored && typeof stored === "object" ? stored : fallback;
      } catch (error) {
        return fallback;
      }
    }

    function writeStored(key, value) {
      try {
        window.localStorage.setItem(key, JSON.stringify(value));
      } catch (error) {
        // Storage blocked or full. The page still remembers while it is open.
      }
    }

    function readStoredString(key) {
      try {
        return String(window.localStorage.getItem(key) || "");
      } catch (error) {
        return "";
      }
    }

    function writeStoredString(key, value) {
      try {
        window.localStorage.setItem(key, value);
      } catch (error) {
        // As above: remembered for this page's lifetime and no longer.
      }
    }

    // A GitHub login is letters, digits and hyphens. Narrowing to that is not validation
    // for its own sake — the login is a component of every key this page stores, and a
    // separator typed into it would put one reader's check-offs under another's name.
    function cleanLogin(value) {
      return String(value || "").trim().replace(/^@+/, "").replace(/[^A-Za-z0-9-]/g, "").slice(0, 39);
    }

    // Read once, at startup, and authoritative from then on: a browser that refuses to
    // store any of this must still behave normally for as long as the page is open.
    const prChecks = readStored(PR_CHECKS_KEY, {});
    const todoChecks = readStored(TODO_CHECKS_KEY, {});

    // A column the table no longer offers is not a sort order, so it is forgotten along
    // with its direction rather than leaving the list sorted by nothing in particular.
    function readPrSort() {
      const stored = readStored(PR_SORT_KEY, {});
      const columns = Array.from(
        document.querySelectorAll("#view-prs th.sortable"), (th) => th.dataset.sort
      );
      return columns.includes(stored.key)
        ? { key: stored.key, desc: Boolean(stored.desc) }
        : { key: "status", desc: false };
    }

    const rememberedSort = readPrSort();

    const state = {
      data: null,
      view: "releases",
      viewer: cleanLogin(readStoredString(VIEWER_KEY)),
      selectedRelease: 0,
      releaseSub: "review",
      selectedCommit: 0,
      selectedPr: 0,
      commitBucket: "",
      bucketChosen: false,
      commitFilter: "",
      prFilter: "",
      route: {},
      prActionMessage: null,
      hideClosedPrs: true,
      hideNonMainPrs: true,
      hideDraftPrs: true,
      prSort: rememberedSort.key,
      prSortDesc: rememberedSort.desc
    };
    const VIEWS = ["releases", "commits", "prs"];
    const ALL_RELEASES = "all";
    const RELEASE_SUBS = ["review", "notes", "announcement", "stats"];
    let suppressRouteUpdate = false;
    const $ = (id) => document.getElementById(id);

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function badge(value) {
      const cls = String(value || "unknown").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
      return `<span class="badge ${cls}">${esc(value || "Unknown")}</span>`;
    }

    // The five answers are one-word verdicts; colour says which way each one points.
    function verdictBadge(value, kind) {
      const v = String(value || "");
      let tone = "neutral";
      if (kind === "label") tone = v === "rfc:required" ? "danger" : v === "rfc:on-roadmap" ? "road" : v ? "ok" : "neutral";
      if (kind === "scope") tone = /^(fix|working-group|rfc)\b/.test(v) ? "ok" : v ? "warn" : "neutral";
      if (kind === "yesno") tone = v === "yes" ? "ok" : v === "no" ? "warn" : "neutral";
      if (kind === "quality") tone = v === "ok" ? "ok" : v === "gaps" ? "warn" : "neutral";
      if (kind === "attention") tone = v === "routine" ? "ok" : v === "elevated" ? "warn" : "neutral";
      return `<span class="badge tone-${tone}">${esc(v || "—")}</span>`;
    }

    function statusBadge(row) {
      if (isStatic) {
        return `<span class="muted" title="The published site is rendered without network access. Run repo-manager site serve for the live Status column.">not live</span>`;
      }
      if (!row.review_status) {
        // Three different silences, and only one of them is a dash. A merged or closed PR
        // genuinely needs nothing. A PR the mirror has not reached yet needs an unknown
        // amount, and drawing that as "nothing needed" is the exact lie this rewrite was
        // written to stop telling.
        if (row.state_known === false) {
          return `<span class="badge tone-neutral" title="Not fetched from GitHub yet">syncing…</span>`;
        }
        const settled = row.pr_state ? `${row.pr_state.toLowerCase()} — nothing needed` : "";
        return `<span class="muted" title="${esc(settled)}">—</span>`;
      }
      // "Approved (1/2)" is not the green "Approved": the rung still wants someone.
      if (/\(\d+\/\d+\)/.test(row.review_status)) {
        return `<span class="badge tone-neutral" title="${esc(row.review_status_detail || "")}">${esc(row.review_status)}</span>`;
      }
      const cls = row.review_status.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
      return `<span class="badge ${cls}" title="${esc(row.review_status_detail || "")}">${esc(row.review_status)}</span>`;
    }

    function shortSha(value) {
      return String(value || "").slice(0, 10);
    }

    // Handles are stored as "@popey" and typed as "popey". One of them is mine, and the
    // page says which rather than leaving me to compare strings.
    function isMe(handle) {
      return Boolean(state.viewer) && cleanLogin(handle).toLowerCase() === state.viewer.toLowerCase();
    }

    function handleCell(handle) {
      if (!handle) return "";
      return `${esc(handle)}${isMe(handle) ? `<span class="you">you</span>` : ""}`;
    }

    // --- routing --------------------------------------------------------------------

    function parseRoute() {
      const rawHash = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : "";
      const params = new URLSearchParams(rawHash || window.location.search.slice(1));
      const view = params.get("view");
      const sub = params.get("sub");
      return {
        view: VIEWS.includes(view) ? view : "",
        sub: RELEASE_SUBS.includes(sub) ? sub : "",
        release: params.get("release") || "",
        bucket: params.get("bucket") || "",
        commit: params.get("commit") || "",
        pr: params.get("pr") || ""
      };
    }

    function applyRouteFromUrl() {
      const route = parseRoute();
      state.route = route;
      if (!route.view && route.commit) route.view = "commits";
      if (!route.view && route.pr) route.view = "prs";
      if (!route.view && (route.release || route.sub)) route.view = "releases";
      // A commit deep link should land on the release it belongs to, not on whatever
      // bucket the filter happened to be showing.
      if (state.data && route.commit && !route.bucket) {
        const row = (state.data.commit_reviews || []).find((item) => matchSha(item.commit_sha, route.commit));
        if (row && row.bucket) route.bucket = row.bucket;
      }
      if (route.view) state.view = route.view;
      if (route.sub) state.releaseSub = route.sub;
      if (route.bucket) {
        state.commitBucket = route.bucket === ALL_RELEASES ? "" : route.bucket;
        state.bucketChosen = true;
      }
    }

    function updateRoute() {
      if (suppressRouteUpdate || !state.data) return;
      const params = new URLSearchParams();
      params.set("view", state.view);
      if (state.view === "releases") {
        const row = releaseList()[state.selectedRelease] || releaseList()[0];
        if (row) params.set("release", row.bucket);
        params.set("sub", state.releaseSub);
      } else if (state.view === "commits") {
        params.set("bucket", state.commitBucket || ALL_RELEASES);
        const row = filteredCommits()[state.selectedCommit] || filteredCommits()[0];
        if (row && row.commit_sha) params.set("commit", row.commit_sha);
      } else if (state.view === "prs") {
        const row = filteredPrs()[state.selectedPr] || filteredPrs()[0];
        if (row && row.pr_number) params.set("pr", String(row.pr_number));
      }
      const next = `#${params.toString()}`;
      if (window.location.hash !== next) {
        history.replaceState(null, "", next);
      }
    }

    function matchSha(value, target) {
      if (!value || !target) return false;
      const full = String(value).toLowerCase();
      const wanted = String(target).toLowerCase();
      return full === wanted || full.startsWith(wanted);
    }

    function scrollSelected(root) {
      requestAnimationFrame(() => {
        const selected = root.querySelector(".selected");
        if (selected) selected.scrollIntoView({ block: "nearest" });
      });
    }

    function asList(items) {
      if (!items || !items.length) return `<p class="muted">None.</p>`;
      return `<ul>${items.map((item) => {
        if (typeof item === "string") return `<li>${esc(item)}</li>`;
        const priority = item.priority ? `${esc(item.priority)}: ` : "";
        const handle = item.handle ? `${esc(item.handle)}: ` : "";
        return `<li>${priority}${handle}${esc(item.text || item.reason || JSON.stringify(item))}</li>`;
      }).join("")}</ul>`;
    }

    function plainList(items) {
      if (!items || !items.length) return `<p class="muted">None.</p>`;
      return `<div class="plain-list">${items.map((item) =>
        `<div class="plain-item">${esc(item)}</div>`).join("")}</div>`;
    }

    function evidenceList(evidence) {
      const entries = Object.entries(evidence || {}).filter(([, value]) => value);
      if (!entries.length) return `<p class="muted">No evidence recorded.</p>`;
      return `<div class="evidence-list">${entries.map(([key, value]) => `
        <div class="evidence-item">
          <h4>${esc(key.replaceAll("_", " "))}</h4>
          <p>${esc(value)}</p>
        </div>
      `).join("")}</div>`;
    }

    // --- to-dos ---------------------------------------------------------------------
    //
    // Every to-do on the page — a commit's maintainer to-dos, a release's tester checklist
    // — is a box I can tick. Ticking it is a note to myself that I have worked through the
    // item; it is stored in this browser under my GitHub login and goes nowhere near the
    // state directory, because the artifact the item came from is still the only record of
    // what the release owes. Two people reading the same published page keep their own.

    // The text is the item's identity. An item the model has since reworded is a different
    // item and arrives unticked, which is the right answer: the words changed, so what I
    // worked through is no longer what the list is asking for.
    function hash32(text) {
      let h = 0x811c9dc5;
      for (let i = 0; i < text.length; i++) {
        h ^= text.charCodeAt(i);
        h = Math.imul(h, 0x01000193);
      }
      return (h >>> 0).toString(36);
    }

    // Every workspace on this machine serves its dashboard from the same localhost origin
    // and so shares one store, which is why the repo belongs in the key.
    function todoScope(kind, id) {
      return `${(state.data && state.data.config.repo) || ""}|${kind}|${id}`;
    }

    function todoKey(scope, text) {
      return `${state.viewer}|${scope}|${hash32(text)}`;
    }

    // A release checklist item and the commit to-do it came from are the same to-do, so
    // they are the same box: the item names its commit, and the key is built from that
    // rather than from whichever list it is being read in. Ticking it on the Releases tab
    // ticks it on the Commits tab, because there was only ever one of it.
    function todoItemScope(item, scope) {
      return item.commit ? todoScope("commit", item.commit) : scope;
    }

    function todoDone(scope, text) {
      return Boolean(todoChecks[todoKey(scope, text)]);
    }

    function todoItemDone(item, scope) {
      return todoDone(todoItemScope(item, scope), item.text);
    }

    function setTodoDone(scope, text, done) {
      const key = todoKey(scope, text);
      if (done) {
        todoChecks[key] = new Date().toISOString();
      } else {
        delete todoChecks[key];
      }
      writeStored(TODO_CHECKS_KEY, todoChecks);
    }

    function openTodos(items, scope) {
      return (items || []).filter((item) => !todoItemDone(item, scope)).length;
    }

    // The scopes on screen, so a box ticked in the reading pane can find the count cell in
    // the list beside it without a full redraw.
    const todoScopes = new Map();

    // Everything I ticked that the artifacts no longer ask for. Ticks belonging to another
    // login are somebody else's notes and are left alone.
    function reconcileTodoChecks() {
      const live = new Set();
      const data = state.data || {};
      for (const row of data.commit_reviews || []) {
        const scope = todoScope("commit", row.commit_sha);
        for (const item of row.todo_items || []) live.add(todoKey(scope, item.text));
      }
      for (const row of data.releases || []) {
        const scope = todoScope("release", row.bucket);
        for (const item of row.todo_items || []) {
          live.add(todoKey(todoItemScope(item, scope), item.text));
        }
      }
      const mine = `${state.viewer}|`;
      let changed = false;
      for (const key of Object.keys(todoChecks)) {
        if (key.startsWith(mine) && !live.has(key)) {
          delete todoChecks[key];
          changed = true;
        }
      }
      if (changed) writeStored(TODO_CHECKS_KEY, todoChecks);
    }

    const PRIORITY_ORDER = ["P0", "P1", "P2"];

    function todoCount(items, scope) {
      const total = (items || []).length;
      if (!total) return `<span class="todo-count done">0</span>`;
      const open = (items || []).filter((item) => !todoItemDone(item, scope));
      const graded = PRIORITY_ORDER
        .map((p) => [p, open.filter((item) => item.priority === p).length])
        .filter(([, count]) => count);
      const title = graded.length
        ? `${graded.map(([p, count]) => `${count} ${p}`).join(", ")} still open, of ${total}`
        : `${open.length} of ${total} still open`;
      return `<span class="todo-count ${open.length ? "" : "done"}" title="${esc(title)}">${
        open.length}<span class="of">/${total}</span></span>`;
    }

    // The priority is the subsection an item sits in. Stamping "P1" on twenty consecutive
    // lines says the same thing twenty times and stops meaning anything; a heading says it
    // once, and the eye can find where the work that stops the release ends.
    function todoGroups(items) {
      const present = [];
      for (const item of items) {
        const priority = item.priority || "";
        if (!present.includes(priority)) present.push(priority);
      }
      const rank = (p) => (PRIORITY_ORDER.indexOf(p) === -1 ? 9 : PRIORITY_ORDER.indexOf(p));
      present.sort((a, b) => rank(a) - rank(b));
      return present.map((priority) =>
        [priority, items.filter((item) => (item.priority || "") === priority)]);
    }

    function todoRow(item, index, scope) {
      const where = (item.platforms || []).filter((p) => String(p).toLowerCase() !== "all");
      const done = todoItemDone(item, scope);
      // The PR and the handle are fields, not something appended to the sentence: the text
      // has to stay exactly what the commit review wrote for the two boxes to be one box.
      //
      // The number links to this item's own commit review, which is where a tester goes when
      // the instruction is not enough — the summary, the verdict and the evidence behind it,
      // one click away, rather than a PR on GitHub that makes them read a diff. The route
      // carries no bucket: the page resolves that from the commit itself.
      const number = item.pr_number
        ? (item.commit
            ? `<a href="#view=commits&commit=${esc(item.commit)}" title="Open this commit's review">#${esc(item.pr_number)}</a>`
            : `#${esc(item.pr_number)}`)
        : "";
      const source = number
        ? ` <span class="todo-source">(${number}${item.author ? `, ${esc(item.author)}` : ""})</span>`
        : "";
      // A to-do now names the command to run, so the backticks around it are rendered rather
      // than shown. mdInline escapes before it substitutes, and the checkbox is keyed on the
      // raw text, so neither safety nor identity depends on what is drawn here.
      return `<label class="todo-item ${done ? "done" : ""}">
        <input type="checkbox" class="todo-check" data-index="${index}" ${done ? "checked" : ""}>
        <span>${mdInline(item.text)}${source}${
          where.length ? ` <span class="platforms">${where.map(esc).join(", ")}</span>` : ""}</span>
      </label>`;
    }

    function todoList(items, scope) {
      if (!items || !items.length) return `<p class="muted">Nothing to check.</p>`;
      const index = new Map(items.map((item, position) => [item, position]));
      const groups = todoGroups(items);
      // An ungraded list — a commit's own to-dos, which nobody has prioritized — is just a
      // list. Drawing one heading over the whole thing would be a label, not a grouping.
      if (groups.length === 1 && !groups[0][0]) {
        return `<div class="todo-list">${
          items.map((item, position) => todoRow(item, position, scope)).join("")}</div>`;
      }
      return groups.map(([priority, rows]) => {
        const open = rows.filter((item) => !todoItemDone(item, scope)).length;
        const label = priority || "Unrated";
        return `<div class="todo-group ${esc((priority || "").toLowerCase())}">${esc(label)}
            <span class="count">${open} of ${rows.length} open</span></div>
          <div class="todo-list">${
            rows.map((item) => todoRow(item, index.get(item), scope)).join("")}</div>`;
      }).join("");
    }

    // Ticking a box writes one key and redraws one label. The counts beside it catch up in
    // place: a redraw here would scroll the pane back to the top of a checklist I am in
    // the middle of working through.
    function attachTodoHandlers(root, items, scope) {
      root.querySelectorAll(".todo-check").forEach((box) => {
        box.addEventListener("change", () => {
          const item = items[Number(box.dataset.index)];
          if (!item) return;
          setTodoDone(todoItemScope(item, scope), item.text, box.checked);
          box.closest(".todo-item").classList.toggle("done", box.checked);
          refreshTodoCounts();
          refreshTodoGroupCounts(root, items, scope);
        });
      });
    }

    // The group heading carries its own "n of m open", and the item that just moved is
    // inside one of them.
    function refreshTodoGroupCounts(root, items, scope) {
      const headings = root.querySelectorAll(".todo-group .count");
      const groups = todoGroups(items);
      headings.forEach((heading, position) => {
        const rows = (groups[position] || [])[1] || [];
        const open = rows.filter((item) => !todoItemDone(item, scope)).length;
        heading.textContent = `${open} of ${rows.length} open`;
      });
    }

    function refreshTodoCounts() {
      document.querySelectorAll("[data-todo-scope]").forEach((cell) => {
        const scope = cell.dataset.todoScope;
        cell.innerHTML = todoCount(todoScopes.get(scope) || [], scope);
      });
    }

    // --- Freshness ------------------------------------------------------------------
    //
    // The page reads a local mirror of GitHub, so it always has an answer and the only
    // open question is how old that answer is. Everything below exists to keep that
    // question answered on screen, and to keep asking it while someone is looking.

    // Polling is a local read; the server decides whether a poll is worth a GitHub call.
    // Thirty seconds is short enough that a review landing while you watch shows up on its
    // own, and the digest means a poll that changes nothing costs a request and no redraw.
    const PR_POLL_MS = 30000;
    let pollTimer = null;
    let syncing = false;

    function agoLabel(iso) {
      const then = Date.parse(iso || "");
      if (!Number.isFinite(then)) return "";
      const seconds = Math.max(0, Math.round((Date.now() - then) / 1000));
      if (seconds < 60) return `${seconds}s ago`;
      if (seconds < 3600) return `${Math.round(seconds / 60)}m ago`;
      if (seconds < 86400) return `${Math.round(seconds / 3600)}h ago`;
      return `${Math.round(seconds / 86400)}d ago`;
    }

    // Redrawn on a one-second timer as well as on every load, because "synced 4s ago" that
    // stays 4s ago is worse than no label at all — it is a claim about right now that
    // quietly stops being true.
    function renderSyncState() {
      const el = $("pr-sync");
      if (!el || isStatic) return;
      const sync = (state.data && state.data.pr_sync) || {};
      el.classList.remove("stale", "failed");
      if (syncing) {
        el.textContent = "syncing…";
        el.title = "Fetching the current state of every reviewed PR from GitHub";
        return;
      }
      if (!sync.synced_at) {
        el.classList.add("stale");
        el.textContent = "not synced yet";
        el.title = "No PR state has been fetched from GitHub yet.";
        return;
      }
      const ago = agoLabel(sync.synced_at);
      if (sync.error) {
        el.classList.add("failed");
        el.textContent = `synced ${ago} · GitHub unreachable`;
        el.title = `The last sync attempt failed: ${sync.error}\nThe Status column is showing the last state fetched successfully.`;
        return;
      }
      el.textContent = `synced ${ago}`;
      el.title = `PR state fetched from GitHub at ${sync.synced_at}`;
    }

    // A poll that finds the same digest touches nothing. That is what makes it safe to
    // poll at all: the reader's selection, scroll position and half-typed search box are
    // not disturbed thirty seconds after they stopped interacting with the page.
    function applyData(payload, options) {
      const quiet = Boolean(options && options.quiet);
      const unchanged = quiet && state.data && payload.digest && payload.digest === state.data.digest;
      state.data = payload;
      if (unchanged) {
        renderSyncState();
        return false;
      }
      // Redrawing a list rewrites its innerHTML, which resets the scroll box to the top.
      // On a poll nobody asked for, that would drag the reader back up the table.
      const wraps = Array.from(document.querySelectorAll(".table-wrap"));
      const scrolls = wraps.map((wrap) => wrap.scrollTop);
      applyRouteFromUrl();
      renderAll();
      if (quiet) wraps.forEach((wrap, index) => { wrap.scrollTop = scrolls[index]; });
      renderSyncState();
      return true;
    }

    async function reloadData(options) {
      if (isStatic) {
        state.data = window.REPO_MANAGER_STATIC_DATA || {};
        applyRouteFromUrl();
        renderAll();
        return;
      }
      const viewerParam = state.viewer ? `?viewer=${encodeURIComponent(state.viewer)}` : "";
      const response = await fetch(`/api/data${viewerParam}`);
      const payload = await response.json();
      if (!state.viewer && payload.viewer) {
        state.viewer = cleanLogin(payload.viewer);
        writeStoredString(VIEWER_KEY, state.viewer);
      }
      applyData(payload, options);
    }

    // Chained rather than an interval, so a slow response can never stack polls behind
    // itself, and hidden tabs stop entirely: nobody is reading, so nothing needs fetching
    // and GitHub does not get asked.
    function schedulePoll() {
      if (isStatic) return;
      clearTimeout(pollTimer);
      if (document.visibilityState !== "visible") return;
      pollTimer = setTimeout(async () => {
        try {
          await reloadData({ quiet: true });
        } catch (error) {
          // Keep showing the last good render. The label already carries the sync's own
          // verdict, and a failed poll is not news worth clearing the screen over.
        }
        schedulePoll();
      }, PR_POLL_MS);
    }

    async function runSync() {
      if (isStatic || syncing) return;
      const button = $("pr-refresh");
      syncing = true;
      if (button) button.disabled = true;
      renderSyncState();
      try {
        const response = await fetch("/api/sync", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ viewer: state.viewer || "" })
        });
        const result = await response.json();
        syncing = false;
        if (result.data) applyData(result.data, { quiet: true });
      } catch (error) {
        syncing = false;
        await reloadData({ quiet: true }).catch(() => {});
      } finally {
        syncing = false;
        if (button) button.disabled = false;
        renderSyncState();
        schedulePoll();
      }
    }

    function section(title, body) {
      return `<div class="section"><h3>${esc(title)}</h3>${body}</div>`;
    }

    function field(label, value) {
      return `<div class="kv"><span>${esc(label)}</span><strong>${esc(value || "")}</strong></div>`;
    }

    function linkedField(label, href, value) {
      if (!href || !value) return field(label, value);
      return `<div class="kv"><span>${esc(label)}</span><strong><a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(value)}</a></strong></div>`;
    }

    function generatedInField(row) {
      const seconds = Number(row.generation_seconds || (row.details || {}).generation_seconds || 0);
      if (!seconds || seconds <= 0) return "";
      return field("Generated in", `${Math.round(seconds)} seconds`);
    }

    // --- what each tab is looking at -------------------------------------------------

    function releaseList() {
      return state.data.releases || [];
    }

    function commitsIn(bucket) {
      const rows = state.data.commit_reviews || [];
      return bucket ? rows.filter((row) => row.bucket === bucket) : rows;
    }

    function filteredCommits() {
      const rows = commitsIn(state.commitBucket);
      const query = state.commitFilter.trim().toLowerCase();
      if (!query) return rows;
      return rows.filter((row) => [
        row.commit_sha, row.verdict, row.summary, row.author, row.verdict_reason, row.bucket, row.branch
      ].join(" ").toLowerCase().includes(query));
    }

    function prVisible(row) {
      if (state.hideClosedPrs && row.pr_state && row.pr_state !== "OPEN") return false;
      if (state.hideNonMainPrs && row.base_ref && row.base_ref !== "main") return false;
      // Only a mirrored draft is hidden; a PR the sync has not reached is shown, like the
      // other two toggles, rather than silently dropped.
      if (state.hideDraftPrs && row.state_known && row.pr_is_draft) return false;
      return true;
    }

    // Ranked by how much the PR wants from *me*, which is the order the Status column is
    // for: my own turn first, then the ones only I can staff, then everything already in
    // somebody else's hands. Ascending is most-action-first, because that is what a
    // maintainer opening the dashboard is looking for.
    const STATUS_ACTION_RANK = {
      "Review": 0,
      "Merge": 1,
      "Needs reviewer": 2,
      "In progress": 3,
      "Waiting for RFC": 4
    };
    function prSortValue(row, key) {
      switch (key) {
        case "pr": return Number(row.pr_number) || 0;
        case "status": {
          const rank = STATUS_ACTION_RANK[row.review_status];
          // An unknown or absent status sorts with the quiet end rather than the top.
          return rank === undefined ? 90 : rank;
        }
        case "attention": return row.attention === "elevated" ? 0 : 1;
        case "author": return String(row.author || "").toLowerCase();
        case "description": return String(row.pr_title || "").toLowerCase();
        default: return 0;
      }
    }

    function sortPrs(rows) {
      const key = state.prSort;
      if (!key) return rows;
      const dir = state.prSortDesc ? -1 : 1;
      // Sorted on a copy: state.data.pr_reviews is the cached payload, and reordering it
      // in place would make the next render depend on the previous one.
      return rows.slice().sort((a, b) => {
        const av = prSortValue(a, key), bv = prSortValue(b, key);
        if (av < bv) return -1 * dir;
        if (av > bv) return 1 * dir;
        // Ties settle on PR number so the order never wobbles between refreshes.
        return (Number(a.pr_number) || 0) - (Number(b.pr_number) || 0);
      });
    }

    function filteredPrs() {
      const rows = (state.data.pr_reviews || []).filter(prVisible);
      const query = state.prFilter.trim().toLowerCase();
      if (!query) return sortPrs(rows);
      return sortPrs(rows.filter((row) => [
        String(row.pr_number), row.pr_title, row.author, row.label, row.scope, row.attention, row.review_status
      ].join(" ").toLowerCase().includes(query)));
    }

    function renderShell() {
      const data = state.data;
      const buckets = data.buckets || [];
      if (state.commitBucket && !buckets.includes(state.commitBucket)) {
        state.commitBucket = "";
      }
      // The newest release is what is in flight, so the commit list opens on it. "All
      // releases" is there for the times the question spans more than one, and once it has
      // been asked for it stays asked for — the default applies to an untouched page only.
      if (!state.bucketChosen && !state.commitBucket && buckets.length) {
        state.commitBucket = buckets[0];
      }
      $("commit-bucket").innerHTML = [
        `<option value="">All releases</option>`,
        ...buckets.map((name) =>
          `<option value="${esc(name)}" ${name === state.commitBucket ? "selected" : ""}>${esc(name)}</option>`)
      ].join("");
      $("repo-name").textContent = `${data.config.repo}${data.config.branch ? ` · ${data.config.branch}` : ""}`;
      const viewerInput = $("viewer");
      if (document.activeElement !== viewerInput) viewerInput.value = state.viewer;
    }

    function dateRange(rows) {
      const dates = rows.map((row) => row.merge_date || row.commit_date || row.reviewed_at).filter(Boolean).map((value) => new Date(value)).filter((date) => !Number.isNaN(date.getTime()));
      if (!dates.length) return {};
      const start = new Date(Math.min(...dates));
      const end = new Date(Math.max(...dates));
      const dayMs = 24 * 60 * 60 * 1000;
      return {
        start: start.toISOString().slice(0, 10),
        end: end.toISOString().slice(0, 10),
        days: Math.floor((Date.UTC(end.getUTCFullYear(), end.getUTCMonth(), end.getUTCDate()) - Date.UTC(start.getUTCFullYear(), start.getUTCMonth(), start.getUTCDate())) / dayMs) + 1
      };
    }

    // --- Releases --------------------------------------------------------------------

    function renderReleases() {
      const rows = releaseList();
      if (state.route.release) {
        const routedIndex = rows.findIndex((row) => row.bucket === state.route.release);
        if (routedIndex !== -1) state.selectedRelease = routedIndex;
      }
      if (rows.length) {
        state.selectedRelease = Math.min(state.selectedRelease, rows.length - 1);
      }
      $("release-count").textContent = `${rows.length} shown`;
      $("release-rows").innerHTML = rows.map((row, index) => {
        const scope = todoScope("release", row.bucket);
        todoScopes.set(scope, row.todo_items || []);
        return `
        <tr data-index="${index}" class="${index === state.selectedRelease ? "selected" : ""}">
          <td class="release-cell">${esc(row.bucket)}${row.is_hotfix ? ` <span class="badge hotfix">hotfix</span>` : ""}</td>
          <td data-todo-scope="${esc(scope)}">${row.reviewed ? todoCount(row.todo_items, scope)
            : `<span class="muted" title="No release review has been built for this bucket yet">not built</span>`}</td>
          <td>${row.commits}</td>
        </tr>`;
      }).join("");
      scrollSelected($("release-rows"));
      $("release-rows").querySelectorAll("tr").forEach((tr) => {
        tr.addEventListener("click", () => {
          state.selectedRelease = Number(tr.dataset.index);
          state.route = {};
          renderReleases();
          updateRoute();
        });
      });
      renderReleaseDetail();
    }

    function currentRelease() {
      const rows = releaseList();
      return rows[state.selectedRelease] || rows[0] || null;
    }

    function renderReleaseDetail() {
      document.querySelectorAll("#release-subtabs .subtab").forEach((button) =>
        button.classList.toggle("active", button.dataset.sub === state.releaseSub));
      const copy = $("release-copy");
      const row = currentRelease();
      if (!row) {
        copy.classList.add("hidden");
        $("release-detail").innerHTML = `<div class="empty">Nothing is filed under a release yet. Run <code>repo-manager commit sweep --branch main</code> to review the range, then <code>repo-manager release build --branch main</code> to write this bucket's checklist, notes and announcement.</div>`;
        return;
      }
      // Offered only when there is something to copy: a button that silently puts an
      // empty string on the clipboard is worse than no button.
      const copyable = {
        notes: row.notes_markdown && "Copy release notes",
        announcement: row.announcement_markdown && "Copy announcement"
      }[state.releaseSub];
      copy.classList.toggle("hidden", !copyable);
      if (copyable) copy.textContent = copyable;
      const renderers = {
        review: releaseReview,
        notes: releaseNotes,
        announcement: releaseAnnouncement,
        stats: releaseStats
      };
      $("release-detail").innerHTML = renderers[state.releaseSub](row);
      if (state.releaseSub === "review") {
        attachTodoHandlers($("release-detail"), row.todo_items || [], todoScope("release", row.bucket));
      }
    }

    function releaseBranch(row) {
      return row.branch || row.bucket.replace(/^v/, "release-v");
    }

    function frozenNote(row) {
      if (!row.frozen || !row.frozen.length) return "";
      return section("Edited by hand", `<p class="muted">repo-manager will not overwrite ${esc(row.frozen.join(", "))}. Pass <code>--force</code> to regenerate.</p>`);
    }

    function releaseReview(row) {
      if (!row.reviewed) {
        return `<div class="empty">No release review for ${esc(row.bucket)} yet. Run <code>repo-manager release build --branch ${esc(releaseBranch(row))}</code>.</div>`;
      }
      return [
        field("Release", row.bucket),
        row.branch ? field("Branch", row.branch) : "",
        row.range_start ? field("Since", row.range_start) : "",
        field("Head", shortSha(row.head_sha)),
        field("Audited", row.reviewed_at),
        generatedInField(row),
        // Above the checklist: what this release does to users is the context the checklist
        // is read in, and a tester who scrolls past twenty to-dos to reach it has already
        // decided what to try.
        section("Breaking Changes", plainList(row.breaking_changes)),
        section("Tester Checklist", todoList(row.todo_items, todoScope("release", row.bucket))),
        frozenNote(row),
        section("Evidence", evidenceList(row.evidence))
      ].join("");
    }

    function releaseNotes(row) {
      if (!row.notes_markdown) {
        return `<div class="empty">No release notes for ${esc(row.bucket)} yet. Run <code>repo-manager release notes --branch ${esc(releaseBranch(row))}</code>.</div>`;
      }
      return [
        field("Release", row.bucket),
        row.range_start ? field("Since", row.range_start) : "",
        field("Generated", row.reviewed_at),
        section("Website Release Highlights", `<pre id="release-notes-markdown">${esc(row.notes_markdown)}</pre>`)
      ].join("");
    }

    function releaseAnnouncement(row) {
      if (!row.announcement_markdown) {
        return `<div class="empty">No Discord announcement for ${esc(row.bucket)} yet. Run <code>repo-manager release announce --branch ${esc(releaseBranch(row))}</code>.</div>`;
      }
      return [
        field("Release", row.bucket),
        row.range_start ? field("Since", row.range_start) : "",
        field("Generated", row.reviewed_at),
        section("Discord Markdown", `<pre id="announcement-markdown">${esc(row.announcement_markdown)}</pre>`)
      ].join("");
    }

    // What this release is made of. Every figure is about the selected bucket, because a
    // dashboard-wide total answers a question nobody is holding: the release is the unit
    // of work, and "how much is left" only means anything inside one.
    //
    // One table, one format, top to bottom. These numbers are read against each other —
    // 4 of 5 checklist items against 1 of 39 commits unreviewed — and a grid of cards
    // makes every comparison a jump between two boxes.
    function statRow(label, value, of) {
      return `<tr><td>${esc(label)}</td><td class="value">${esc(value)}${
        of ? ` <span class="of">of ${esc(of)}</span>` : ""}</td></tr>`;
    }

    function statGroup(label) {
      return `<tr class="group"><td colspan="2">${esc(label)}</td></tr>`;
    }

    function releaseStats(row) {
      const commits = commitsIn(row.bucket);
      const releaseScope = todoScope("release", row.bucket);
      const checklist = row.todo_items || [];
      const commitTodos = commits.reduce((sum, c) => sum + (c.todo_items || []).length, 0);
      const openCommitTodos = commits.reduce(
        (sum, c) => sum + openTodos(c.todo_items, todoScope("commit", c.commit_sha)), 0);
      const byPriority = PRIORITY_ORDER.map((priority) => {
        const rows = checklist.filter((item) => item.priority === priority);
        return [priority, rows.filter((item) => !todoItemDone(item, releaseScope)).length, rows.length];
      });
      const authors = new Set(commits.map((c) => c.author).filter(Boolean));
      const reviewers = new Set(commits.flatMap((c) => c.reviewers || []));
      const range = dateRange(commits);
      const verdicts = {};
      commits.forEach((c) => {
        if (c.verdict) verdicts[c.verdict] = (verdicts[c.verdict] || 0) + 1;
      });
      const inRange = commits.length + Number(row.commits_unreviewed || 0);
      return `<table class="stats-table"><tbody>
        ${statGroup("Left to do")}
        ${byPriority.map(([priority, open, total]) =>
            statRow(priority, open, total)).join("")}
        ${statRow("Checklist total", openTodos(checklist, releaseScope), checklist.length)}
        ${statRow("Commit to-dos open", openCommitTodos, commitTodos)}
        ${statGroup("Commits")}
        ${statRow("Reviewed", commits.length, inRange)}
        ${statRow(state.viewer ? `Authored by @${state.viewer}` : "Authored by you",
                  state.viewer ? commits.filter((c) => isMe(c.author)).length : "\u2014")}
        ${statRow("Unique authors", authors.size)}
        ${statRow("Unique reviewers", reviewers.size)}
        ${statGroup("Verdicts")}
        ${Object.entries(verdicts).sort((a, b) => b[1] - a[1])
            .map(([verdict, count]) => statRow(verdict, count)).join("")
          || statRow("No commits reviewed yet", 0)}
        ${statGroup("Dates")}
        ${statRow("First commit", range.start || "\u2014")}
        ${statRow("Last commit", range.end || "\u2014")}
        ${statRow("Days of work", range.days || 0)}
      </tbody></table>`;
    }

    // --- Commits ---------------------------------------------------------------------

    function renderCommits() {
      const rows = filteredCommits();
      if (state.route.commit) {
        const routedIndex = rows.findIndex((row) => matchSha(row.commit_sha, state.route.commit));
        if (routedIndex !== -1) {
          state.selectedCommit = routedIndex;
        }
      }
      if (rows.length) {
        state.selectedCommit = Math.min(state.selectedCommit, rows.length - 1);
      }
      $("commit-count").textContent = `${rows.length} shown`;
      $("commit-rows").innerHTML = rows.map((row, index) => {
        const scope = todoScope("commit", row.commit_sha);
        todoScopes.set(scope, row.todo_items || []);
        return `
        <tr data-index="${index}" class="${index === state.selectedCommit ? "selected" : ""}">
          <td>${index + 1}</td>
          <td class="commit-cell" title="${esc(row.commit_sha)}">${esc(shortSha(row.commit_sha))}</td>
          <td>${badge(row.verdict)}</td>
          <td data-todo-scope="${esc(scope)}">${todoCount(row.todo_items, scope)}</td>
          <td><div class="description">${esc(row.summary)}</div></td>
          <td>${handleCell(row.author)}</td>
        </tr>`;
      }).join("");
      scrollSelected($("commit-rows"));
      $("commit-rows").querySelectorAll("tr").forEach((tr) => {
        tr.addEventListener("click", () => {
          state.selectedCommit = Number(tr.dataset.index);
          state.route = {};
          renderCommits();
          updateRoute();
        });
      });
      const row = rows[state.selectedCommit] || rows[0];
      if (!row) {
        $("commit-detail").innerHTML = `<div class="empty">No commit reviews saved here yet.</div>`;
        $("commit-selected").textContent = "";
        return;
      }
      $("commit-selected").textContent = shortSha(row.commit_sha);
      const scope = todoScope("commit", row.commit_sha);
      const prUrl = row.pr_number ? `https://github.com/${state.data.config.repo}/pull/${row.pr_number}` : "";
      $("commit-detail").innerHTML = [
        field("Commit", row.commit_sha),
        linkedField("PR", prUrl, row.pr_number ? `#${row.pr_number}` : ""),
        `<div class="kv"><span>Author</span><strong>${handleCell(row.author)}</strong></div>`,
        row.bucket ? field("Release", row.bucket) : "",
        row.merge_date ? field("Merged", row.merge_date) : "",
        field("Audited", row.reviewed_at),
        generatedInField(row),
        section("Description", `<p>${esc(row.summary)}</p>`),
        section("Verdict", `<p>${badge(row.verdict)} ${esc(row.verdict_reason || "")}</p>`),
        section("Maintainer To-Do", todoList(row.todo_items, scope)),
        section("Shout Outs", asList(row.shout_outs)),
        section("Evidence", evidenceList(row.evidence || {}))
      ].join("");
      attachTodoHandlers($("commit-detail"), row.todo_items || [], scope);
    }

    // --- PRs -------------------------------------------------------------------------

    async function runPrAction(path, prNumber) {
      const response = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pr_number: prNumber })
      });
      let result = {};
      try {
        result = await response.json();
      } catch (error) {
        result = {};
      }
      if (!response.ok || !result.ok) {
        throw new Error(result.error || "Action failed");
      }
      return result;
    }

    function describePrActionResult(kind, result) {
      if (kind === "comment") {
        // Not the URL: the reload that follows puts the same link in the "Posted comment"
        // line right below this one, and the two together read as two comments.
        return result.action === "updated" ? "Updated the review comment." : "Posted the review comment.";
      }
      if (kind === "label") {
        const steps = { label: "applied the label", draft: "marked as draft", message: "posted the RFC request" };
        const done = (result.done || []).map((step) => steps[step] || step);
        return `${result.label}: ${done.join(", ") || "already applied, nothing to do"}.`;
      }
      const parts = [];
      if ((result.requested || []).length) parts.push(`Requested: ${result.requested.join(", ")}`);
      (result.skipped || []).forEach((item) => parts.push(`Skipped ${item.handle} (${item.reason})`));
      (result.failed || []).forEach((item) => parts.push(`Failed ${item.handle}: ${item.reason}`));
      (result.warnings || []).forEach((warning) => parts.push(warning));
      return parts.join(" · ") || "No reviewers left to request.";
    }

    function prActions(row) {
      const disabled = isStatic ? "disabled" : "";
      const message = state.prActionMessage && state.prActionMessage.pr === row.pr_number
        ? `<p class="muted" id="pr-action-result">${esc(state.prActionMessage.text)}</p>`
        : `<p class="muted hidden" id="pr-action-result"></p>`;
      const commentLink = row.comment_url
        ? `<p class="muted">Comment on GitHub: <a href="${esc(row.comment_url)}" target="_blank" rel="noopener noreferrer">${esc(row.comment_url)}</a></p>`
        : "";
      // A covered rung has no slate below the rule, so the button would be acting on names
      // that are not on screen — and on #3210 one of those names was a reviewer already
      // requested on the PR. The tooltip says who is covering it, so the button explains
      // itself rather than just refusing. `repo-manager pr request-reviewers N` still works:
      // typing the command is an explicit override, clicking a button you cannot read is not.
      // The label button is the same act the GitHub Action will perform on every new PR:
      // apply the triage's rfc: label, and for rfc:required also draft the PR and post the
      // standard request. Once GitHub already shows the label there is nothing left to do.
      // For rfc:required the button stays live: the message step is not visible from the
      // mirror, and every step is idempotent, so a click on a PR that is done says so.
      const labelApplied = row.label !== "rfc:required" && (row.pr_labels || []).includes(row.label);
      const labelButton = row.label === "rfc:required" ? "Request RFC" : `Apply ${row.label}`;
      const labelTitle = labelApplied
        ? `${row.label} is already applied on GitHub`
        : row.label === "rfc:required"
          ? "Apply rfc:required, mark the PR as a draft, and post the standard RFC request (steps already done are skipped)"
          : `Apply the ${row.label} label on GitHub`;
      const covered = (row.coverage || {}).adequate;
      const who = ((row.coverage || {}).who || []).join(", ");
      const reviewersTitle = covered
        ? `Not needed — this PR already has the reviewers its rung asks for${who ? ` (${who})` : ""}`
        : "Request the suggested reviewers on GitHub";
      return `
        <div class="pr-actions">
          <button class="copy" id="pr-post-comment" data-pr="${row.pr_number}" ${disabled}>Post review comment</button>
          <button class="copy" id="pr-request-reviewers" data-pr="${row.pr_number}" title="${esc(reviewersTitle)}" ${disabled || (covered ? "disabled" : "")}>Request reviewers</button>
          <button class="copy" id="pr-apply-label" data-pr="${row.pr_number}" title="${esc(labelTitle)}" ${disabled || (labelApplied ? "disabled" : "")}>${esc(labelButton)}</button>
        </div>
        ${message}
        ${commentLink}`;
    }

    function attachPrActionHandlers(row) {
      if (isStatic) return;
      const bindings = [
        ["pr-post-comment", "/api/pr-comment", "comment"],
        ["pr-request-reviewers", "/api/pr-reviewers", "reviewers"],
        ["pr-apply-label", "/api/pr-apply-label", "label"]
      ];
      bindings.forEach(([id, path, kind]) => {
        const button = $(id);
        if (!button) return;
        button.addEventListener("click", async () => {
          button.disabled = true;
          const original = button.textContent;
          button.textContent = "Working...";
          try {
            const result = await runPrAction(path, Number(button.dataset.pr));
            const warnings = (result.warnings || []).length && kind === "comment"
              ? ` (${result.warnings.join("; ")})` : "";
            state.prActionMessage = {
              pr: Number(button.dataset.pr),
              text: describePrActionResult(kind, result) + warnings
            };
            await reloadData();
          } catch (error) {
            button.disabled = false;
            button.textContent = original;
            alert(error.message);
          }
        });
      });
    }

    // The comment is markdown, and the pane is a preview of it, so the pane has to render
    // markdown. Only the subset render_pr_review_comment actually emits is handled —
    // headings, checklists, nested notes, and inline emphasis. Anything else falls through
    // as a paragraph, which is the right failure for a preview: it shows the literal text.
    function mdInline(text) {
      return esc(text)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[\s(])\*([^*]+)\*/g, "$1<em>$2</em>")
        .replace(/(^|[\s(])_([^_]+)_/g, "$1<em>$2</em>");
    }

    // The line that leads the comment, and the only pill that keeps its full sentence: a
    // chip reading "not ready" alone, floating above the to-dos, is a status nobody can
    // read without the markdown behind it. The value here is the badge's colour class.
    const MD_VERDICTS = {
      "ready for review": "ready",
      "not ready for review yet": "not-ready"
    };

    // "Focus: <b>focused</b>" — the label stays a label, the verdict becomes the pill the
    // list columns use. On GitHub the same line is bold text; only the rendering differs.
    function mdSummary(text) {
      const parts = text.match(/^(.*?):\s*<b>(.*?)<\/b>(.*)$/);
      // A bare summary ("Explanation") is a control, not a heading — the section it belongs
      // to is the line above it, and a fold that outweighs its own section inverts the page.
      if (!parts) return `<span class="md-fold-label">${mdInline(text)}</span>`;
      return `<span class="md-label">${mdInline(parts[1])}</span> ${mdBadge(parts[2])}${mdInline(parts[3])}`;
    }

    // Section verdicts carry counts ("2 to resolve"), so they cannot each have a class of
    // their own. The pill is coloured by what the verdict means instead: green when there is
    // nothing to do, yellow when there is, red when something is absent that should not be,
    // grey when nobody looked.
    function mdBadge(verdict) {
      const value = verdict.trim().toLowerCase();
      let tone = "neutral";
      if (/^(none found|none|adequate|accurate|focused|all cleared|not-applicable)$/.test(value)) {
        tone = "ok";
      } else if (/(to resolve|^gaps$|discrepancies|bundled|suggested|no maintainer)/.test(value)) {
        tone = "warn";
      } else if (/^missing$/.test(value)) {
        tone = "danger";
      }
      return `<span class="badge tone-${tone}">${esc(verdict)}</span>`;
    }

    // `depth` is how many <details> deep this line sits. Emphasis follows nesting: a bold
    // line at the top level is a section of the comment, the same line inside a fold is a
    // block within one. Reading weight off the markup rather than off a list of known
