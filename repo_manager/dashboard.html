<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lemonade release dashboard</title>
<style>
  /* Ready is the absence of colour. The page only raises its voice when something is
     wrong, because what the reader is scanning for is trouble, not reassurance. */
  :root {
    color-scheme: light dark;
    --paper: #fbfbf8;
    --panel: #ffffff;
    --ink: #1a1b1e;
    --muted: #63656b;
    --rule: #e5e5df;
    --lemon: #e3b505;
    --alarm: #b3261e;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, "Cascadia Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #131417;
      --panel: #191a1e;
      --ink: #e9e9e4;
      --muted: #9a9ca3;
      --rule: #2c2d33;
      --lemon: #f2c541;
      --alarm: #ff8a7a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 15px/1.6 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  code, .mono { font-family: var(--mono); font-size: .92em; }
  a { color: inherit; text-underline-offset: 2px; text-decoration-color: var(--rule); }
  a:hover { text-decoration-color: currentColor; }
  :focus-visible { outline: 2px solid var(--lemon); outline-offset: 2px; border-radius: 2px; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 28px; }

  /* --- masthead ------------------------------------------------------------------ */
  .mast { padding-top: 34px; }
  .wordmark {
    font: 500 13px/1 var(--sans); letter-spacing: .01em; color: var(--muted);
    padding-bottom: 6px; border-bottom: 2px solid var(--lemon); display: inline-block;
  }

  /* The hero is the question the page exists to answer. The verdict is carried by the
     rule beside it, never by colouring one word of the sentence. */
  .verdict-head { margin: 26px 0 0; padding-left: 18px; border-left: 3px solid var(--rule); }
  .verdict-head.attention { border-left-color: var(--lemon); }
  .verdict-head.blocked { border-left-color: var(--alarm); }
  .verdict-head h1 {
    font: 500 30px/1.25 var(--sans); letter-spacing: -.02em; margin: 0 0 6px;
  }
  .verdict-head h1 .bucket { font-family: var(--mono); font-size: .86em; letter-spacing: 0; }
  .verdict-head p { margin: 0; max-width: 62ch; color: var(--muted); }
  .verdict-head p.reason { color: var(--ink); }

  .tally { margin: 22px 0 0; display: flex; flex-wrap: wrap; gap: 26px; font-size: 13.5px; color: var(--muted); }
  .tally b { font-weight: 600; color: var(--ink); }
  .tally .bad b { color: var(--alarm); }

  nav { display: flex; gap: 26px; margin-top: 26px; border-bottom: 1px solid var(--rule); }
  nav button {
    appearance: none; background: none; border: 0; cursor: pointer; font: 500 15px/1 var(--sans);
    color: var(--muted); padding: 0 0 11px; margin-bottom: -1px; border-bottom: 2px solid transparent;
  }
  nav button:hover { color: var(--ink); }
  nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--lemon); }
  nav .n { color: var(--muted); font-weight: 400; font-size: 12.5px; margin-left: 6px; font-family: var(--mono); }

  main { padding: 26px 0 96px; }

  .filters { display: flex; gap: 10px; margin-bottom: 20px; }
  input[type="search"], select {
    font: 400 14px var(--sans); padding: 8px 11px; border: 1px solid var(--rule);
    background: var(--panel); color: var(--ink); border-radius: 3px;
  }
  input[type="search"] { flex: 1 1 auto; min-width: 0; }

  /* --- a bucket reads as one report, not a stack of identical cards ---------------- */
  .report { background: var(--panel); border: 1px solid var(--rule); border-left-width: 3px; margin-bottom: 26px; }
  .report.attention { border-left-color: var(--lemon); }
  .report.blocked { border-left-color: var(--alarm); }
  .report > header { padding: 20px 26px 16px; }
  .report h2 { font: 600 20px/1.2 var(--mono); margin: 0 0 8px; letter-spacing: -.01em; }
  .meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 18px; }
  .meta .frozen { color: var(--lemon); }
  section { padding: 18px 26px; border-top: 1px solid var(--rule); }
  section > h3 { font: 600 13px/1.3 var(--sans); margin: 0 0 10px; color: var(--muted); }
  section > p, section > dl { max-width: 68ch; }
  section > p { margin: 0 0 8px; }

  ol.todos, ul.plain { list-style: none; margin: 0; padding: 0; max-width: 72ch; }
  ol.todos li, ul.plain li { display: flex; gap: 12px; padding: 8px 0; border-top: 1px solid var(--rule); }
  ol.todos li:first-child, ul.plain li:first-child { border-top: 0; padding-top: 0; }
  .pri { font: 600 12px/1.6 var(--mono); flex: 0 0 22px; }
  .pri.p0 { color: var(--alarm); }
  .pri.p1 { color: var(--lemon); }
  .dot { flex: 0 0 22px; color: var(--muted); }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font: 600 12.5px/1.3 var(--sans); color: var(--muted);
    padding: 0 14px 9px 0; border-bottom: 1px solid var(--rule); white-space: nowrap;
  }
  td { padding: 10px 14px 10px 0; border-bottom: 1px solid var(--rule); font-size: 14px; vertical-align: top; }
  th:last-child, td:last-child { padding-right: 0; }
  .listing { background: var(--panel); border: 1px solid var(--rule); padding: 18px 22px; }
  tbody tr.row { cursor: pointer; }
  tbody tr.row:hover td { background: color-mix(in srgb, var(--lemon) 9%, transparent); }
  tr.detail > td { background: color-mix(in srgb, var(--lemon) 5%, transparent); padding: 4px 0 18px; }
  tr.detail .inner { padding: 14px 18px; max-width: 78ch; }
  tr.detail h3 { font: 600 13px/1.3 var(--sans); color: var(--muted); margin: 16px 0 8px; }
  tr.detail h3:first-child { margin-top: 0; }
  tr.detail p { margin: 0 0 8px; }
  .nowrap { white-space: nowrap; }
  .quiet { color: var(--muted); }
  .attention-text { color: var(--lemon); font-weight: 600; }
  .blocked-text { color: var(--alarm); font-weight: 600; }

  /* The release page is machine-parsed, so it is shown exactly as it is stored. The
     Discord post is prose, so it is shown the way its readers will see it. */
  pre.exact {
    margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--mono);
    font-size: 13px; line-height: 1.65; background: var(--paper); padding: 16px 18px;
    border: 1px solid var(--rule); max-height: 420px; overflow: auto;
  }
  .post { max-width: 68ch; }
  .post h4 { font: 600 15px/1.35 var(--sans); margin: 18px 0 6px; }
  .post h4:first-child { margin-top: 0; }
  .post p { margin: 0 0 8px; }
  .post ul { margin: 0 0 8px; padding-left: 20px; }

  dl.evidence { margin: 0; max-width: 72ch; }
  dl.evidence dt { font: 600 13px/1.5 var(--sans); color: var(--muted); margin-top: 12px; }
  dl.evidence dt:first-child { margin-top: 0; }
  dl.evidence dd { margin: 0; }

  .plan th, .plan td { font-size: 13.5px; }
  .plan td:first-child { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }

  .empty { color: var(--muted); padding: 56px 0; max-width: 54ch; }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
  .actions button {
    font: 500 13px var(--sans); padding: 7px 13px; border: 1px solid var(--rule);
    background: var(--panel); color: var(--ink); border-radius: 3px; cursor: pointer;
  }
  .actions button:hover:not(:disabled) { border-color: var(--lemon); }
  .actions button:disabled { color: var(--muted); cursor: default; }
  .result { font-size: 13px; color: var(--muted); }

  @media (max-width: 720px) {
    .wrap { padding: 0 18px; }
    .verdict-head h1 { font-size: 24px; }
    .hide-narrow { display: none; }
    .report > header, section, tr.detail .inner { padding-left: 18px; padding-right: 18px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap mast">
  <div class="wordmark">lemonade release</div>
  <div id="hero"></div>
  <div class="tally" id="tally"></div>
  <nav id="tabs" role="tablist"></nav>
</div>
<main class="wrap"><div id="view"><p class="empty">Loading the state directory.</p></div></main>
<script>
const STATIC = !!window.REPO_MANAGER_STATIC;
let DATA = window.REPO_MANAGER_DATA || null;
let TAB = "releases";
let QUERY = "";
let FILTER = "";
const OPEN = new Set();

const esc = (value) => String(value == null ? "" : value)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

// Enough Markdown for the Discord post: headings, bullets, bold, code. Everything is
// escaped first, so nothing a review quotes can become markup.
function md(text) {
  const out = [];
  let list = false;
  const inline = (s) => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  for (const line of esc(text || "").split("\n")) {
    const heading = line.match(/^#{1,6}\s+(.*)$/);
    const bullet = line.match(/^\s*[-*]\s+(.*)$/);
    if (heading) {
      if (list) { out.push("</ul>"); list = false; }
      out.push(`<h4>${inline(heading[1])}</h4>`);
    } else if (bullet) {
      if (!list) { out.push("<ul>"); list = true; }
      out.push(`<li>${inline(bullet[1])}</li>`);
    } else {
      if (list) { out.push("</ul>"); list = false; }
      if (line.trim()) out.push(`<p>${inline(line)}</p>`);
    }
  }
  if (list) out.push("</ul>");
  return out.join("");
}

const tone = (verdict) => ({
  "Blocked": "blocked", "Blocker": "blocked",
  "Needs Attention": "attention",
}[verdict] || "");
const toneText = (verdict) => {
  const t = tone(verdict);
  return t ? `<span class="${t}-text">${esc(verdict)}</span>` : `<span class="quiet">${esc(verdict)}</span>`;
};
const day = (iso) => (iso || "").slice(0, 10);
const short = (sha) => String(sha || "").slice(0, 7);
const repoUrl = () => DATA.repo ? `https://github.com/${DATA.repo}` : "";
const link = (path, text) => repoUrl() ? `<a href="${repoUrl()}${path}">${text}</a>` : text;
const matches = (text) => !QUERY || String(text).toLowerCase().includes(QUERY);

// --- masthead -------------------------------------------------------------------------

function hero() {
  const bucket = DATA.releases[0];
  const box = document.getElementById("hero");
  if (!bucket) {
    box.innerHTML = `<div class="verdict-head"><h1>No release has been built yet</h1>
      <p>Run <code>repo-manager release build</code> to write a bucket's verdict, release page, and post.</p></div>`;
    return;
  }
  const said = { "Ready": "is ready to ship", "Needs Attention": "needs attention",
                 "Blocked": "is blocked" }[bucket.verdict] || "has not been reviewed";
  box.innerHTML = `<div class="verdict-head ${tone(bucket.verdict)}">
    <h1><span class="bucket">${esc(bucket.bucket)}</span> ${esc(said)}</h1>
    ${bucket.verdict_reason ? `<p class="reason">${esc(bucket.verdict_reason)}</p>` : ""}
  </div>`;
}

function tally() {
  const c = DATA.counts;
  const parts = [];
  if (DATA.repo) parts.push(`<span><b>${esc(DATA.repo)}</b></span>`);
  parts.push(`<span><b>${c.commits}</b> ${c.commits === 1 ? "commit" : "commits"} reviewed</span>`);
  if (c.blockers) parts.push(`<span class="bad"><b>${c.blockers}</b> open ${c.blockers === 1 ? "blocker" : "blockers"}</span>`);
  if (c.prs) parts.push(`<span><b>${c.prs}</b> pull ${c.prs === 1 ? "request" : "requests"} triaged</span>`);
  document.getElementById("tally").innerHTML = parts.join("");
}

function tabs() {
  const spec = [["releases", "Releases", DATA.releases.length],
                ["commits", "Commits", DATA.commits.length],
                ["prs", "Pull requests", DATA.prs.length]];
  document.getElementById("tabs").innerHTML = spec.map(([id, label, n]) =>
    `<button role="tab" data-tab="${id}" aria-selected="${TAB === id}">${label}<span class="n">${n}</span></button>`
  ).join("");
}

function filterBar(placeholder, options) {
  const choices = (options || []).map((o) =>
    `<option value="${esc(o)}"${FILTER === o ? " selected" : ""}>${esc(o)}</option>`).join("");
  return `<div class="filters">
    <input type="search" id="q" placeholder="${esc(placeholder)}" value="${esc(QUERY)}" aria-label="${esc(placeholder)}">
    ${options && options.length ? `<select id="f" aria-label="Filter"><option value="">Everything</option>${choices}</select>` : ""}
  </div>`;
}

// --- views ----------------------------------------------------------------------------

function releasesView() {
  if (!DATA.releases.length) {
    return `<p class="empty">No release has been built yet. <code>repo-manager release build --branch main</code>
      reviews the range since the last tag and writes the bucket's verdict, release page, and post.</p>`;
  }
  const rows = DATA.releases.filter((r) => matches(`${r.bucket} ${r.verdict} ${r.verdict_reason} ${r.branch}`));
  if (!rows.length) return `<p class="empty">No release bucket matches that search.</p>`;
  return rows.map((r) => {
    const meta = [
      r.branch ? esc(r.branch) : "",
      r.range_start ? `since ${esc(r.range_start)}` : "",
      r.head_sha ? `at <span class="mono">${esc(short(r.head_sha))}</span>` : "",
      r.commits ? `${r.commits} ${r.commits === 1 ? "commit" : "commits"}` : "",
      r.is_hotfix ? `hotfix over ${esc(r.last_stable_tag)}` : "",
      r.reviewed_at ? `reviewed ${esc(day(r.reviewed_at))}` : "",
    ].filter(Boolean).map((m) => `<span>${m}</span>`).join("");
    const frozen = r.frozen.length
      ? `<span class="frozen">edited by hand: ${esc(r.frozen.join(", "))}</span>` : "";
    const todos = (r.prioritized_todos || []).map((t) =>
      `<li><span class="pri ${t.priority === "P0" ? "p0" : "p1"}">${esc(t.priority || "P1")}</span>
        <span>${esc(t.text || "")}</span></li>`).join("");
    const breaking = (r.breaking_changes || []).map((b) =>
      `<li><span class="dot">&bull;</span><span>${esc(b)}</span></li>`).join("");
    const plan = (r.tester_plan || []).map((p) =>
      `<tr><td>${esc(p.platform)}</td><td>${esc(p.changed)}</td><td>${esc(p.exercise)}</td></tr>`).join("");
    const evidence = Object.entries(r.evidence || {}).map(([k, v]) =>
      `<dt>${esc(k.replace(/_/g, " "))}</dt><dd>${esc(v)}</dd>`).join("");
    const issues = (r.candidate_issues || []).map((n) => link(`/issues/${n}`, `#${n}`)).join(", ");
    return `<article class="report ${tone(r.verdict)}">
      <header>
        <h2>${esc(r.bucket)}</h2>
        <div class="meta">${meta}${frozen}</div>
      </header>
      ${r.verdict_reason ? `<section><h3>Can we ship?</h3><p>${esc(r.verdict_reason)}</p></section>` : ""}
      ${todos ? `<section><h3>Before tagging</h3><ol class="todos">${todos}</ol></section>` : ""}
      ${breaking ? `<section><h3>Breaking changes</h3><ul class="plain">${breaking}</ul></section>` : ""}
      ${issues ? `<section><h3>Tester reports in this verdict</h3><p>${issues}</p></section>` : ""}
      ${plan ? `<section><h3>What testers should exercise</h3><table class="plan">
        <thead><tr><th>Platform</th><th>What changed</th><th>What to try</th></tr></thead>
        <tbody>${plan}</tbody></table></section>` : ""}
      ${evidence ? `<section><h3>Evidence behind the verdict</h3><dl class="evidence">${evidence}</dl></section>` : ""}
      ${r.notes ? `<section><h3>notes.md, as the release page will read it</h3>
        <pre class="exact">${esc(r.notes)}</pre></section>` : ""}
      ${r.announcement ? `<section><h3>announcement.md, as Discord will render it</h3>
        <div class="post">${md(r.announcement)}</div></section>` : ""}
    </article>`;
  }).join("");
}

function commitsView() {
  if (!DATA.commits.length) {
    return `<p class="empty">No commit has been reviewed yet. <code>repo-manager commit sweep --branch main</code>
      reviews every commit in the range that has no file.</p>`;
  }
  const bucketList = [...new Set(DATA.commits.map((c) => c.bucket).filter(Boolean))];
  const rows = DATA.commits.filter((c) => (!FILTER || c.bucket === FILTER) &&
    matches(`${c.summary} ${c.author} ${c.verdict} ${c.sha} ${c.pr_number} ${c.subject}`));
  const bar = filterBar("Search summaries, authors, SHAs", bucketList);
  if (!rows.length) return bar + `<p class="empty">No commit review matches that search.</p>`;
  const body = rows.map((c) => {
    const todos = (c.maintainer_todos || []).map((t) =>
      `<li><span class="dot">&bull;</span><span>${esc(t)}</span></li>`).join("");
    const shouts = (c.shout_outs || []).map((s) => `<li><span class="dot">&bull;</span><span>${
      esc(typeof s === "string" ? s : `${s.handle || ""} — ${s.reason || ""}`)}</span></li>`).join("");
    const evidence = Object.entries(c.evidence || {}).map(([k, v]) =>
      `<dt>${esc(k.replace(/_/g, " "))}</dt><dd>${esc(v)}</dd>`).join("");
    const detail = OPEN.has("c" + c.sha) ? `<tr class="detail"><td colspan="6"><div class="inner">
      ${c.verdict_reason ? `<p>${esc(c.verdict_reason)}</p>` : ""}
      ${todos ? `<h3>What a maintainer should do</h3><ul class="plain">${todos}</ul>` : ""}
      ${shouts ? `<h3>Shout outs</h3><ul class="plain">${shouts}</ul>` : ""}
      ${evidence ? `<h3>Evidence</h3><dl class="evidence">${evidence}</dl>` : ""}
      <p class="quiet">${link(`/commit/${esc(c.sha)}`, `<span class="mono">${esc(short(c.sha))}</span>`)}
        ${c.cherry_picked_from ? `, cherry-picked from <span class="mono">${esc(short(c.cherry_picked_from))}</span>` : ""}
        ${c.reviewed_at ? `, reviewed ${esc(day(c.reviewed_at))}` : ""}</p>
    </div></td></tr>` : "";
    return `<tr class="row" data-open="c${esc(c.sha)}" tabindex="0">
      <td class="nowrap quiet">${esc(day(c.committed_at))}</td>
      <td class="nowrap mono">${esc(short(c.sha))}</td>
      <td class="nowrap">${c.pr_number ? link(`/pull/${c.pr_number}`, `#${c.pr_number}`) : ""}</td>
      <td class="nowrap hide-narrow">${esc(c.author)}</td>
      <td class="nowrap">${toneText(c.verdict)}</td>
      <td>${esc(c.summary || c.subject)}</td></tr>${detail}`;
  }).join("");
  return bar + `<div class="listing"><table>
    <thead><tr><th>Merged</th><th>Commit</th><th>PR</th><th class="hide-narrow">Author</th>
    <th>Verdict</th><th>What it does</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

function prsView() {
  if (!DATA.prs.length) {
    return `<p class="empty">No pull request has been triaged yet. <code>repo-manager pr sweep</code>
      triages every open PR whose file is out of date.</p>`;
  }
  const labels = [...new Set(DATA.prs.map((p) => p.label).filter(Boolean))];
  const rows = DATA.prs.filter((p) => (!FILTER || p.label === FILTER) &&
    matches(`${p.title} ${p.author} ${p.label} ${p.scope} ${p.number}`));
  const bar = filterBar("Search titles, authors, labels", labels);
  if (!rows.length) return bar + `<p class="empty">No triage matches that search.</p>`;
  const body = rows.map((p) => {
    const concerns = (p.concerns || []).map((item) => {
      const nested = item.startsWith("  - ");
      return `<li><span class="dot">${nested ? "&mdash;" : "&bull;"}</span><span>${
        md(item.trim()).replace(/^<p>|<\/p>$/g, "")}</span></li>`;
    }).join("");
    const detail = OPEN.has("p" + p.number) ? `<tr class="detail"><td colspan="7"><div class="inner">
      ${p.explanation.diff ? `<h3>What the diff changes</h3><p>${esc(p.explanation.diff)}</p>` : ""}
      <h3>What a reviewer has to worry about</h3>
      ${concerns ? `<ul class="plain">${concerns}</ul>` : `<p class="quiet">Nothing to flag.</p>`}
      ${p.explanation.reviewers ? `<h3>Why these reviewers</h3><p>${esc(p.explanation.reviewers)}</p>` : ""}
      <p class="quiet">${p.head_sha ? `<span class="mono">${esc(short(p.head_sha))}</span>` : ""}
        ${p.reviewed_at ? `, triaged ${esc(day(p.reviewed_at))}` : ""}
        ${p.comment_url ? `, <a href="${esc(p.comment_url)}">comment posted</a>` : ""}</p>
      ${STATIC ? "" : `<div class="actions" data-pr="${p.number}">
        <button data-act="comment">Post comment</button>
        <button data-act="label">Apply ${esc(p.label)}</button>
        <button data-act="reviewers">Request reviewers</button>
        <span class="result" role="status"></span></div>`}
    </div></td></tr>` : "";
    return `<tr class="row" data-open="p${p.number}" tabindex="0">
      <td class="nowrap">${p.url ? `<a href="${esc(p.url)}">#${p.number}</a>` : `#${p.number}`}</td>
      <td>${esc(p.title)}</td>
      <td class="nowrap hide-narrow">${esc(p.author)}</td>
      <td class="nowrap mono">${esc(p.label)}</td>
      <td class="nowrap hide-narrow quiet">${esc(p.scope)}</td>
      <td class="nowrap">${p.body_matches_diff === "no"
        ? `<span class="blocked-text">no</span>` : `<span class="quiet">yes</span>`}</td>
      <td class="nowrap">${p.docs_and_tests === "gaps"
        ? `<span class="attention-text">gaps</span>` : `<span class="quiet">ok</span>`}</td>
      </tr>${detail}`;
  }).join("");
  return bar + `<div class="listing"><table>
    <thead><tr><th>PR</th><th>Title</th><th class="hide-narrow">Author</th><th>Label</th>
    <th class="hide-narrow">Scope</th><th>Body matches</th><th>Docs &amp; tests</th></tr></thead>
    <tbody>${body}</tbody></table></div>`;
}

// --- wiring ---------------------------------------------------------------------------

function draw(keepFocus) {
  if (!DATA) return;
  hero();
  tally();
  tabs();
  document.getElementById("view").innerHTML = { releases: releasesView, commits: commitsView, prs: prsView }[TAB]();
  const q = document.getElementById("q");
  if (q) {
    q.addEventListener("input", (event) => { QUERY = event.target.value.toLowerCase(); draw(true); });
    if (keepFocus) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
  const f = document.getElementById("f");
  if (f) f.addEventListener("change", (event) => { FILTER = event.target.value; draw(); });
}

function toggle(key) {
  if (OPEN.has(key)) OPEN.delete(key); else OPEN.add(key);
  draw();
}

document.addEventListener("click", (event) => {
  const tab = event.target.closest("nav button");
  if (tab) { TAB = tab.dataset.tab; QUERY = ""; FILTER = ""; draw(); return; }
  const act = event.target.closest(".actions button");
  if (act) { runAction(act); return; }
  if (event.target.closest("a")) return;
  const row = event.target.closest("tr[data-open]");
  if (row) toggle(row.dataset.open);
});

document.addEventListener("keydown", (event) => {
  if (event.key !== "Enter" && event.key !== " ") return;
  const row = event.target.closest && event.target.closest("tr[data-open]");
  if (row) { event.preventDefault(); toggle(row.dataset.open); }
});

async function runAction(button) {
  const box = button.closest(".actions");
  const result = box.querySelector(".result");
  const endpoints = { comment: "/api/pr-comment", label: "/api/pr-label", reviewers: "/api/pr-reviewers" };
  box.querySelectorAll("button").forEach((b) => (b.disabled = true));
  result.textContent = "Working…";
  try {
    const response = await fetch(endpoints[button.dataset.act], {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ number: Number(box.dataset.pr) }),
    });
    const data = await response.json();
    result.textContent = data.ok
      ? (data.url || [...(data.done || []), ...(data.requested || [])].join(", ") || "Done.")
      : `Did not happen: ${data.error || "unknown error"}`;
  } catch (error) {
    result.textContent = `Did not happen: ${error}`;
  }
  box.querySelectorAll("button").forEach((b) => (b.disabled = false));
}

(async function load() {
  if (!DATA) DATA = await (await fetch("/api/data")).json();
  draw();
})();
</script>
</body>
</html>
